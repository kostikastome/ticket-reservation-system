# Local MySQL for running the app with TR_STORAGE=jdbc.
#   docker compose up -d
# The application creates its tables on first start.
services:
  mysql:
    image: mysql:8.4
    container_name: ticket-reservation-mysql
    environment:
      MYSQL_DATABASE: ticket_reservation
      MYSQL_USER: ticket_app
      MYSQL_PASSWORD: ${TR_DB_PASSWORD:-change-me}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
